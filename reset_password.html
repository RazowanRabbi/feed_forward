<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | FeedForward</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#f0fdf4",
              100: "#dcfce7",
              600: "#16a34a",
              700: "#15803d"
            }
          },
          boxShadow: {
            soft: "0 10px 30px rgba(15, 23, 42, 0.08)"
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center px-6">
  <div class="w-full max-w-md rounded-[28px] border border-slate-200 bg-white p-8 shadow-soft">
    <a href="index.html" class="mb-8 flex items-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-brand-600 text-lg font-bold text-white">
        F
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-900">FeedForward</h1>
        <p class="text-sm text-slate-500">Set a new password</p>
      </div>
    </a>

    <h2 class="text-3xl font-bold text-slate-900">Reset password</h2>

    <p class="mt-3 text-sm leading-6 text-slate-600">
      Enter your new password below. Your reset link expires after 15 minutes.
    </p>

    <form id="resetForm" class="mt-6 space-y-4">
      <div>
        <label for="password" class="mb-2 block text-sm font-semibold text-slate-700">
          New Password
        </label>

        <input
          id="password"
          type="password"
          required
          minlength="6"
          placeholder="Enter new password"
          class="w-full rounded-2xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-brand-600 focus:ring-4 focus:ring-brand-100"
        />
      </div>

      <div>
        <label for="confirmPassword" class="mb-2 block text-sm font-semibold text-slate-700">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          required
          minlength="6"
          placeholder="Confirm new password"
          class="w-full rounded-2xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-brand-600 focus:ring-4 focus:ring-brand-100"
        />
      </div>

      <button
        type="submit"
        class="w-full rounded-2xl bg-brand-600 px-6 py-3 text-sm font-semibold text-white shadow-soft transition hover:bg-brand-700"
      >
        Reset Password
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      Back to
      <a href="login.html" class="font-semibold text-brand-700 hover:text-brand-900">
        Login
      </a>
    </p>
  </div>

  <script src="js/resetPassword.js"></script>
</body>
</html>
