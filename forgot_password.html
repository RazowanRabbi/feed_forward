<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | FeedForward</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#f0fdf4",
                100: "#dcfce7",
                600: "#16a34a",
                700: "#15803d",
              },
            },
            boxShadow: {
              soft: "0 10px 30px rgba(15, 23, 42, 0.08)",
            },
          },
        },
      };
    </script>
  </head>

  <body class="min-h-screen bg-slate-50 flex items-center justify-center px-6">
    <div
      class="w-full max-w-md rounded-[28px] border border-slate-200 bg-white p-8 shadow-soft"
    >
      <a href="index.html" class="mb-8 flex items-center gap-3">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-2xl bg-brand-600 text-lg font-bold text-white"
        >
          F
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900">FeedForward</h1>
          <p class="text-sm text-slate-500">Recover your account</p>
        </div>
      </a>

      <h2 class="text-3xl font-bold text-slate-900">Forgot password?</h2>

      <p class="mt-3 text-sm leading-6 text-slate-600">
        Enter your registered email address. We will generate a secure reset
        link for your account.
      </p>

      <form id="forgotForm" class="mt-6 space-y-4">
        <div>
          <label
            for="email"
            class="mb-2 block text-sm font-semibold text-slate-700"
          >
            Email Address
          </label>

          <input
            id="email"
            type="email"
            required
            placeholder="Enter your email"
            class="w-full rounded-2xl border border-slate-300 px-4 py-3 text-sm outline-none focus:border-brand-600 focus:ring-4 focus:ring-brand-100"
          />
        </div>

        <button
          type="submit"
          class="w-full rounded-2xl bg-brand-600 px-6 py-3 text-sm font-semibold text-white shadow-soft transition hover:bg-brand-700"
        >
          Generate Reset Link
        </button>
      </form>

      <div
        id="resetBox"
        class="mt-6 hidden rounded-2xl border border-brand-100 bg-brand-50 p-4"
      >
        <p class="text-sm font-semibold text-brand-900">Reset email sent.</p>

        <p class="mt-2 text-sm leading-6 text-brand-900">
          Please check your inbox for the password reset link.
        </p>
      </div>
      <p class="mt-6 text-center text-sm text-slate-600">
        Remembered your password?
        <a
          href="login.html"
          class="font-semibold text-brand-700 hover:text-brand-900"
        >
          Back to login
        </a>
      </p>
    </div>

    <script src="js/forgotPassword.js"></script>
  </body>
</html>
