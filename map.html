<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Map | FeedForward</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#f0fdf4",
                100: "#dcfce7",
                500: "#22c55e",
                600: "#16a34a",
                700: "#15803d",
                900: "#14532d",
              },
            },
            boxShadow: {
              soft: "0 14px 40px rgba(15, 23, 42, 0.10)",
              glow: "0 20px 60px rgba(34, 197, 94, 0.22)",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="css/style.css" />

    <style>
      #feedForwardMap {
        height: calc(100vh - 88px);
        width: 100%;
      }

      .custom-map-marker {
        cursor: pointer;
        transform: translate(-50%, -100%);
      }

      .donor-marker {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        object-fit: cover;
        border: 4px solid white;
        background: white;
        box-shadow: 0 16px 35px rgba(15, 23, 42, 0.28);
      }

      .self-marker {
        border-color: #22c55e;
        box-shadow:
          0 0 0 6px rgba(34, 197, 94, 0.2),
          0 18px 40px rgba(34, 197, 94, 0.35);
      }

      .food-image-marker {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        object-fit: cover;
        border: 4px solid white;
        background: white;
        box-shadow: 0 16px 35px rgba(22, 163, 74, 0.35);
      }

      .food-fallback-marker {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #16a34a, #14532d);
        color: white;
        font-size: 25px;
        border: 4px solid white;
        box-shadow: 0 16px 35px rgba(22, 163, 74, 0.35);
      }
    </style>
  </head>

  <body class="bg-slate-50 text-slate-800">
    <header
      class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur"
    >
      <div
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4"
      >
        <a href="feed.html" class="flex items-center gap-3">
          <div
            class="flex h-11 w-11 items-center justify-center rounded-2xl bg-brand-600 text-lg font-bold text-white shadow-soft"
          >
            F
          </div>
          <div>
            <h1 class="text-xl font-bold text-slate-900">FeedForward Map</h1>
            <p class="text-xs text-slate-500">
              Donors and food pickup locations
            </p>
          </div>
        </a>

        <a
          href="feed.html"
          class="rounded-2xl bg-slate-900 px-5 py-2 text-sm font-semibold text-white hover:bg-brand-700"
        >
          Back to Feed
        </a>
      </div>
    </header>

    <main class="relative">
      <div id="feedForwardMap"></div>

      <section
        class="absolute left-4 top-4 z-[999] w-[calc(100%-32px)] max-w-md rounded-[28px] border border-white/80 bg-white/95 p-5 shadow-glow backdrop-blur"
      >
        <div class="flex items-start justify-between gap-4">
          <div>
            <h2 class="text-xl font-black text-slate-950">Nearby Map</h2>
            <p id="mapStatus" class="mt-1 text-xs font-semibold text-slate-500">
              Loading donors and food posts...
            </p>
          </div>

          <button
            id="locateMeBtn"
            class="rounded-2xl bg-brand-600 px-4 py-2 text-xs font-black text-white hover:bg-brand-700"
          >
            Locate Me
          </button>
        </div>

        <input
          id="mapSearch"
          type="text"
          placeholder="Search donor, food, area, city..."
          class="mt-4 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm font-medium outline-none focus:border-brand-600 focus:ring-4 focus:ring-brand-100"
        />

        <div class="mt-4 grid grid-cols-3 gap-2 text-center text-xs font-bold">
          <button
            id="showAllBtn"
            class="rounded-2xl bg-brand-600 px-3 py-2 text-white"
          >
            All
          </button>
          <button
            id="showDonorsBtn"
            class="rounded-2xl bg-slate-100 px-3 py-2 text-slate-600"
          >
            Donors
          </button>
          <button
            id="showFoodBtn"
            class="rounded-2xl bg-slate-100 px-3 py-2 text-slate-600"
          >
            Food
          </button>
        </div>
      </section>
    </main>

    <script src="js/map.js"></script>

    <script
      async
      defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDhZRCUDr97eGLzlw66fH7DE7KuljFx1Sg&callback=initGoogleMap&loading=async"
    ></script>
  </body>
</html>
